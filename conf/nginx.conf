worker_processes 1;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /var/log/nginx/lab.log info;

events {
    worker_connections 4096;
}

http {
    access_log off;
    default_type application/octet-stream;

    server {
        listen 18443 ssl;
        http2 on;
        http2_max_concurrent_streams 5000;

        ssl_certificate /opt/lab/cert.pem;
        ssl_certificate_key /opt/lab/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_buffer_size 4k;

        location / { root /opt/lab/html; }
        location /big.bin { root /opt/lab/html; max_ranges 16; }
        location = /__lab.log { alias /var/log/nginx/lab.log; default_type text/plain; }
    }
}
